name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 系统 WebView 是 Android SDK 自带,无需下载任何内核 AAR。
      # 原 Crosswalk/GeckoView 下载步骤已移除。

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Generate signing keystore
        run: |
          if [ ! -f app/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias tv-fox \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass tvfox123 \
              -keypass tvfox123 \
              -dname "CN=TVFoxBrowser, OU=App, O=TVFoxBrowser, L=CN, ST=CN, C=CN"
          fi

      - name: Sign Release APK
        run: |
          BUILD_DIR="app/build/outputs/apk/release"
          # 系统 WebView 无 native 库打包,单一通用 APK 即可在所有架构运行。
          # 显式启用 v1+v2+v3 三种签名方案,兼容 Android 5+ 全部 TV 系统
          # (部分国产 ROM 只认 v1 / 只认 v2,缺失对应方案会「安装失败」)
          SRC="$BUILD_DIR/app-release-unsigned.apk"
          OUT="$BUILD_DIR/tv-fox-release.apk"
          echo "Signing $SRC -> $OUT"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks app/release.keystore \
            --ks-key-alias tv-fox \
            --ks-pass pass:tvfox123 \
            --key-pass pass:tvfox123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --in "$SRC" \
            --out "$OUT"
          # 验证签名,失败则立即终止,避免上传未签名 / 损坏的 APK
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$OUT" >/dev/null || { echo "VERIFY FAILED: $OUT"; exit 1; }
          echo "Signed APK:"
          ls -la "$OUT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-fox-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-fox-release
          path: app/build/outputs/apk/release/tv-fox-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v5.0-webview-${{ github.run_number }}
          name: TV Fox Browser v5.0-webview Build ${{ github.run_number }}
          body: |
            ## TV Fox Browser 自动构建

            基于 Android 系统 WebView 的 TV 浏览器(APK 仅 ~5MB,内存占用极低)。
            已弃用 GeckoView(需 2GB RAM,海尔 434MB 设备 OOM)和 Crosswalk(Chromium 53 UI 错乱)。

            ### 下载
            - **Debug 版本**:tv-fox-debug (artifact)
            - **Release 版本**:tv-fox-release (artifact / 下方附件)

            ### 架构
            通用 APK(无 native 库,~5MB),支持 armv7/arm64/x86 全架构。
            目标设备:海尔 HRA920L (Android 5.1, ro.product.cpu.abi = armeabi-v7a)

            ### ⚠️ B站视频播放需先升级系统 WebView
            海尔 Android 5.1 自带 WebView 是 Chrome 39(2014),不支持 MSE,B站放不了。
            本 APK 已用 Chrome 120 伪装 UA 绕过版本检测,但 MSE 仍需内核本身支持。
            **请侧载安装新版「Android System WebView」APK(70+)后再使用 B站。**
            详见 README 或搜索"Android System WebView APK"。

            ### 安装方式
            1. 下载 APK 文件
            2. 通过 U盘 或 ADB 安装到 Android TV 设备
            3. 确保电视已开启「允许安装未知来源应用」

            ### 遥控器操作
            - **方向键**:D-pad 焦点导航
            - **OK键**:点击 / 确认
            - **返回键**:网页后退 / 关闭 Overlay / 退出
            - **菜单键**:打开设置

            ### 崩溃日志
            若出现闪退,可在电视文件管理器查看:
            `/Android/data/com.tvfoxbrowser/files/crash/latest.txt`
          files: |
            app/build/outputs/apk/release/tv-fox-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
