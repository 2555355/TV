pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // GeckoView 发布在 Mozilla 自有 Maven 仓库(不在 mavenCentral!)
        // artifact: org.mozilla.geckoview:geckoview-arm64-v8a:69.0.20190903125908
        maven { url "https://maven.mozilla.org/maven2/" }
    }
}
rootProject.name = "TvFoxBrowser"
include ':app'
