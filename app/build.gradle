plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tvfoxbrowser'
    compileSdk 34

    defaultConfig {
        applicationId "com.tvfoxbrowser"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.0"
        // 只保留中英语言资源,移除 AndroidX 自带的其他语言(~2MB)
        resourceConfigurations += ['zh', 'zh-rCN', 'zh-rTW', 'en']
    }

    // ABI splits: 为每个 CPU 架构单独生成 APK,
    // 避免 GeckoView 的 4 个架构 native 库全打进同一个包。
    // TV 设备绝大多数为 arm64-v8a,仅需分发这个即可。
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    // APK 维度版本号:让不同 ABI 的 APK 有不同 versionCode,
    // 避免同设备安装多个架构版本冲突。
    android.applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abi = output.getFilter(com.android.build.api.variant.FilterConfiguration.FilterType.ABI.toString())
            def abiCode = abi == 'arm64-v8a' ? 1 : abi == 'armeabi-v7a' ? 2 : 0
            output.versionCodeOverride = (variant.versionCode ?: 1) * 10 + abiCode
        }
    }

    buildTypes {
        release {
            // 关闭 R8 代码压缩 + 资源压缩。
            // 之前开启 minifyEnabled=true 导致手机启动不了:
            // R8 可能把 GeckoView JNI 反射需要的类给移除/混淆了,
            // 即使有 -keep 规则也难以覆盖 GeckoView 内部所有的反射路径。
            // 体积优先级低于可用性,先确保能启动。
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    // 打包时排除多余资源
    packagingOptions {
        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    // AndroidX - TV UI 组件(精简,移除未使用的 material / constraintlayout / viewmodel)
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // GeckoView - Firefox 内核 (124 Release)
    implementation 'org.mozilla.geckoview:geckoview:124.0.20240321230221'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'
}
