plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tvfoxbrowser'
    compileSdk 34

    defaultConfig {
        applicationId "com.tvfoxbrowser"
        minSdk 21
        targetSdk 34
        versionCode 16
        versionName "5.0-webview"
        // 只保留中英语言资源,移除 AndroidX 自带的其他语言
        resourceConfigurations += ['zh', 'zh-rCN', 'zh-rTW', 'en']
        // 系统 WebView 复用 ROM 自带 native 库,无需打包任何 .so,APK 极小(~5MB)
        // 也不需要 abiFilters:同一 APK 在 armv7/arm64/x86 设备都能装
    }

    // 不再需要 ABI splits:
    // 系统 WebView 无 native 库打包,单一通用 APK 即可。

    buildTypes {
        release {
            // 关闭 R8 压缩。体积已经很小(几 MB),不需要压缩。
            // 开启 R8 反而可能因为混淆导致 WebView 反射出问题。
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // lint 检查不阻塞 release 构建
            // (QUERY_ALL_PACKAGES 等 Google Play 政策警告不影响 TV 端自用)
            lint {
                abortOnError false
                checkReleaseBuilds false
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    // AndroidX - TV UI 组件
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // ===== 浏览器内核 =====
    // 使用 Android 系统 WebView(复用 ROM 自带内核,APK 仅 ~5MB)。
    // 已弃用 GeckoView(需 2GB RAM,海尔 HRA920L 仅 434MB 会 OOM)和 Crosswalk(Chromium 53 UI 错乱)。
    // 系统 WebView 内核版本取决于 ROM:海尔 Android 5.1 自带 Chrome 39(不支持 MSE),
    //   需用户侧载升级 "Android System WebView" APK 到 70+ 才能播放 B站。
    // 代码层面已用 Chrome 120 伪装 UA 绕过 B站版本检测,但 MSE 仍需内核本身支持。
    // 无需任何 implementation 依赖,android.webkit.WebView 是 Android SDK 自带。

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'
}
