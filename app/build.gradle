plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tvfoxbrowser'
    compileSdk 34

    defaultConfig {
        applicationId "com.tvfoxbrowser"
        minSdk 21
        targetSdk 34
        versionCode 12
        versionName "3.0"
        // 只保留中英语言资源,移除 AndroidX 自带的其他语言
        resourceConfigurations += ['zh', 'zh-rCN', 'zh-rTW', 'en']

        ndk {
            // Crosswalk 23.53.589.4 只提供 armeabi-v7a 和 x86
            // 用户设备是 Amlogic armv7,这里只打 armv7 一个架构,APK 约 25MB
            // (打 x86 也用不上,徒增体积)
            abiFilters 'armeabi-v7a'
        }
    }

    // 不再需要 ABI splits:
    // 换用系统 WebView 后,APK 不再打包任何 native 库(GeckoView 的 libxul.so 50MB 已移除),
    // 系统的 libwebview.so 由 ROM 提供,与 APK 无关。
    // 单一 APK 即可在所有 CPU 架构运行,且体积很小。

    buildTypes {
        release {
            // 关闭 R8 压缩。体积已经很小(几 MB),不需要压缩。
            // 开启 R8 反而可能因为混淆导致 WebView 反射出问题。
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // lint 检查不阻塞 release 构建
            // (QUERY_ALL_PACKAGES 等 Google Play 政策警告不影响 TV 端自用)
            lint {
                abortOnError false
                checkReleaseBuilds false
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    // AndroidX - TV UI 组件
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // ===== 浏览器内核 =====
    // Crosswalk 嵌入式 Chromium 内核(自带 MSE/H.264/HLS,Android 5.1 兼容)
    // 替代系统 WebView(系统是 Chrome 39 太老,B 站等现代站点不支持)
    // louisgeek 修改版:修复无 SSL 证书 https 站点的 ERR_SECURITY_RESPONSE 异常
    implementation 'com.github.louisgeek:xwalk_core_library:23.53.589.4'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'
}
