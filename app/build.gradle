plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tvfoxbrowser'
    compileSdk 34

    defaultConfig {
        applicationId "com.tvfoxbrowser"
        minSdk 21
        targetSdk 34
        versionCode 15
        versionName "4.0-gecko-armv7"
        // 只保留中英语言资源,移除 AndroidX 自带的其他语言
        resourceConfigurations += ['zh', 'zh-rCN', 'zh-rTW', 'en']

        ndk {
            // GeckoView armeabi-v7a 专属包:只含 armeabi-v7a 的 libxul.so / libnss3.so 等
            // (geckoview-armeabi-v7a:69.0.20190903125908)
            // 目标设备:海尔 HRA920L (Android 5.1, ro.product.cpu.abi = armeabi-v7a)
            abiFilters 'armeabi-v7a'
        }
    }

    // 不再需要 ABI splits:
    // GeckoView armeabi-v7a 专属包自带 armeabi-v7a native 库,单一 APK 即可在 32 位 armv7 设备运行。

    buildTypes {
        release {
            // 关闭 R8 压缩。体积已经很小(几 MB),不需要压缩。
            // 开启 R8 反而可能因为混淆导致 WebView 反射出问题。
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // lint 检查不阻塞 release 构建
            // (QUERY_ALL_PACKAGES 等 Google Play 政策警告不影响 TV 端自用)
            lint {
                abortOnError false
                checkReleaseBuilds false
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    // AndroidX - TV UI 组件
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // ===== 浏览器内核 =====
    // GeckoView 嵌入式 Gecko 内核(Mozilla,Firefox 同款引擎)
    // 替代 Crosswalk(Chromium 53 太老,不支持现代 CSS,网站 UI 错乱)
    // GeckoView 69(2019,Gecko 69)完整支持 CSS Grid / flex-gap / sticky / MSE,
    // 渲染兼容性远好于 Chromium 53。
    // armeabi-v7a 专属包(目标设备海尔 HRA920L 为 32 位 armv7,Android 5.1)
    // minSdk 21(Android 5.0),Java 8,无需 Java 17(那是 GeckoView 130+ 才需要)
    implementation 'org.mozilla.geckoview:geckoview-armeabi-v7a:69.0.20190903125908'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'
}
